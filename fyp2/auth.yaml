AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blue Current contributor sign-in
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
Parameters:
  VideoSource: {Type: String, Default: underwater-demo}
  VideoTable: {Type: String, Default: underwater-video-automation-VideosTable-17FE21BM26FFA}
  SiteUrl:
    Type: String
    Default: https://onnnn425.github.io/underwater_world/
  GoogleClientId:
    Type: String
    Default: ''
  GoogleSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN containing a JSON client_secret field
Conditions:
  HasGoogle: !And [!Not [!Equals [!Ref GoogleClientId, '']], !Not [!Equals [!Ref GoogleSecretArn, '']]]
Resources:
  Pool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
  Admins:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref Pool
  AdminActivity:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: journal, AttributeType: S}
        - {AttributeName: entry, AttributeType: S}
      KeySchema:
        - {AttributeName: journal, KeyType: HASH}
        - {AttributeName: entry, KeyType: RANGE}
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Pool
      Domain: !Sub 'blue-current-${AWS::AccountId}'
  Google:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref Pool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleSecretArn}:SecretString:client_secret}}'
        authorize_scopes: openid email profile
      AttributeMapping: {email: email, email_verified: email_verified}
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Pool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: !If [HasGoogle, [COGNITO, !Ref Google], [COGNITO]]
      CallbackURLs: [!Ref SiteUrl, 'https://bluecurrentvideo.com/']
      LogoutURLs: [!Ref SiteUrl, 'https://bluecurrentvideo.com/']
  ContributorApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['https://onnnn425.github.io', 'https://bluecurrentvideo.com']
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        DefaultAuthorizer: Contributor
        Authorizers:
          Contributor:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}'
              audience: [!Ref Client]
  WhoAmI:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      InlineCode: |
        exports.handler = async event => ({
          statusCode: 200,
          headers: {'Cache-Control': 'no-store'},
          body: JSON.stringify({userId: event.requestContext.authorizer.jwt.claims.sub})
        });
      Events:
        Session:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContributorApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: Contributor
              AuthorizationScopes: [openid]
  ContributorVideos:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          SOURCE: !Ref VideoSource
          TABLE: !Ref VideoTable
          ACTIVITY: !Ref AdminActivity
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub 'arn:aws:s3:::${VideoSource}/incoming/contributors/*'
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${VideoSource}/incoming/*.mp4'
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt AdminActivity.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub 'arn:aws:s3:::${VideoSource}/staging/contributors/*'
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VideoTable}'
      InlineCode: |
        import base64, hashlib, json, os, re, uuid
        from datetime import datetime, timezone
        from botocore.client import Config
        from botocore.exceptions import ClientError
        import boto3
        from boto3.dynamodb.conditions import Attr
        s3 = boto3.client('s3', config=Config(signature_version='s3v4', s3={'addressing_style':'virtual'}))
        table = boto3.resource('dynamodb').Table(os.environ['TABLE'])
        activity = boto3.resource('dynamodb').Table(os.environ['ACTIVITY'])
        def reply(code, **body):
            return {'statusCode': code, 'headers': {'cache-control':'no-store'}, 'body':json.dumps(body)}
        def handler(event, context):
            route = event['routeKey']
            admin = route.split(' ',1)[1].startswith('/admin/')
            claims = event['requestContext']['authorizer']['jwt']['claims']
            groups = claims.get('cognito:groups', [])
            if isinstance(groups, str):
                groups = groups.strip('[]').replace('"','').replace(',', ' ').split()
            if admin and 'Admins' not in groups:
                return reply(403, message='Administrator access required.')
            params = event.get('queryStringParameters') or {}
            cursor = params.get('after')
            if route == 'GET /admin/activity':
                options = dict(KeyConditionExpression='journal = :journal',
                               ExpressionAttributeValues={':journal':'videos'}, Limit=50, ScanIndexForward=False)
                if cursor: options['ExclusiveStartKey'] = {'journal':'videos','entry':cursor}
                page = activity.query(**options)
                return reply(200, items=page['Items'], after=page.get('LastEvaluatedKey',{}).get('entry'))
            if route == 'GET /admin/videos':
                options = {'Limit':100}
                if cursor: options['ExclusiveStartKey'] = {'videoId':cursor}
                page = table.scan(**options)
                videos = []
                for item in page['Items']:
                    video = {k:str(item[k]) for k in ('videoId','title','status','description','category','createdAt',
                             'publishedAt','updatedAt','duration','errorMessage','mediaConvertJobId','streamUrl') if k in item}
                    match = re.fullmatch(r'incoming/contributors/([^/]+)/[^/]+', item.get('sourceKey',''))
                    video['owner'] = match.group(1) if match else 'Uploader unknown'
                    videos.append(video)
                return reply(200, videos=videos, after=page.get('LastEvaluatedKey',{}).get('videoId'))
            if not admin:
                return manage(event, False)
            body = json.loads(event.get('body') or '{}')
            if route == 'POST /admin/videos' and not body.get('uploadId'):
                return manage(event, True)
            now = datetime.now(timezone.utc).isoformat()
            entry = dict(journal='videos',entry=now+'#'+context.aws_request_id,at=now,actor=claims['sub'],
                         action=route.split(' ')[0],videoId=(event.get('pathParameters') or {}).get('id',''),
                         outcome='Requested')
            if entry['action']=='POST':
                key = 'incoming/contributors/'+claims['sub']+'/'+str(body.get('uploadId'))+'.mp4'
                entry['videoId'] = str(body.get('uploadId'))+'-'+hashlib.sha256(key.encode()).hexdigest()[:8]
            if entry['action']=='PATCH' and isinstance(body.get('previous'),list) and len(body['previous'])==2:
                entry['fields'] = [name for name,old,new in zip(('description','categories'),body['previous'],
                    (body.get('description'),', '.join(str(x) for x in body.get('categories',[])) or 'Uncategorised')) if old!=new]
            activity.put_item(Item=entry)
            try:
                result = manage(event, True)
                entry['outcome'] = json.loads(result['body']).get('message','Accepted')
                return result
            except Exception:
                entry['outcome'] = 'Operation could not be confirmed'
                raise
            finally:
                activity.put_item(Item=entry)
        def manage(event, admin):
            user = event['requestContext']['authorizer']['jwt']['claims']['sub']
            prefix = 'incoming/contributors/' + str(uuid.UUID(user)) + '/'
            method = event['requestContext']['http']['method']
            if method == 'GET':
                options = dict(FilterExpression=Attr('sourceKey').begins_with(prefix),
                               ProjectionExpression='videoId,title,#s,createdAt,category,description',
                               ExpressionAttributeNames={'#s':'status'})
                videos = []
                while True:
                    page = table.scan(**options)
                    videos.extend(page['Items'])
                    if 'LastEvaluatedKey' not in page: break
                    options['ExclusiveStartKey'] = page['LastEvaluatedKey']
                return reply(200, videos=sorted(videos,key=lambda v:v.get('createdAt',''),reverse=True))
            if method == 'POST':
                title = (event.get('queryStringParameters') or {}).get('title','').strip()
                if not (1 <= len(title) <= 120 and title.isascii() and title.isprintable()):
                    return reply(400, message='Enter a title of 1–120 printable ASCII characters.')
                if event['headers'].get('content-type','').startswith('application/json'):
                    params = json.loads(event.get('body') or '{}')
                    category = params.get('category','')
                    if not isinstance(category,str) or len(category)>60 or ',' in category or (category and not category.isprintable()):
                        return reply(400,message='Enter one category of up to 60 characters without commas.')
                    category = category.strip() or 'Uncategorised'
                    token = params.get('uploadId')
                    bucket = os.environ['SOURCE']
                    if token is None:
                        size = params.get('size')
                        if type(size) is not int or not 16 <= size <= 100000000:
                            return reply(400,message='Choose an MP4 up to 100 MB.')
                        token = str(uuid.uuid4())
                        staged = 'staging/contributors/' + user + '/' + token
                        upload = s3.generate_presigned_post(bucket, staged,
                            Fields={'Content-Type':'video/mp4'},
                            Conditions=[{'Content-Type':'video/mp4'}, ['content-length-range',size,size]],
                            ExpiresIn=900)
                        return reply(200, uploadId=token, upload=upload)
                    if not isinstance(token,str) or not re.fullmatch(r'[a-f0-9-]{36}',token):
                        return reply(400,message='Invalid upload reference.')
                    staged = 'staging/contributors/' + user + '/' + token
                    try:
                        header = s3.get_object(Bucket=bucket,Key=staged,Range='bytes=0-15')
                    except ClientError as error:
                        if error.response['ResponseMetadata']['HTTPStatusCode'] in (403,404,416):
                            return reply(400,message='Upload missing or incomplete.')
                        raise
                    if header['Body'].read()[4:8] != b'ftyp' or int(header['ContentRange'].split('/')[-1]) > 100000000:
                        s3.delete_object(Bucket=bucket,Key=staged)
                        return reply(400,message='Choose a valid MP4 up to 100 MB.')
                    s3.copy_object(Bucket=bucket,Key=prefix+token+'.mp4',
                        CopySource={'Bucket':bucket,'Key':staged},CopySourceIfMatch=header['ETag'],
                        MetadataDirective='REPLACE',Metadata={'title':title,'category64':base64.b64encode(category.encode()).decode()},ContentType='video/mp4')
                    s3.delete_object(Bucket=bucket,Key=staged)
                    return reply(202,message='Upload received.')
                if not event.get('isBase64Encoded') or event['headers'].get('content-type') != 'video/mp4':
                    return reply(400, message='Choose an MP4 video.')
                data = base64.b64decode(event['body'])
                if len(data) > 4194304 or len(data) < 16 or data[4:8] != b'ftyp':
                    return reply(400, message='Choose an MP4 file up to 4 MiB.')
                stem = str(uuid.uuid4())
                key = prefix + stem + '.mp4'
                s3.put_object(Bucket=os.environ['SOURCE'], Key=key, Body=data,
                              ContentType='video/mp4', Metadata={'title':title}, IfNoneMatch='*')
                return reply(202, videoId=stem+'-'+hashlib.sha256(key.encode()).hexdigest()[:8])
            record = table.get_item(Key={'videoId':event['pathParameters']['id']},ConsistentRead=True).get('Item',{})
            key = record.get('sourceKey','')
            if admin:
                if not key.startswith('incoming/') or not key.endswith('.mp4'):
                    return reply(409,message='No managed MP4 source for this record.')
            elif not key.startswith(prefix) or not re.fullmatch(r'[0-9a-f-]{36}\.mp4',key[len(prefix):]):
                return reply(404,message='Video not found.')
            if method == 'PATCH':
                try:
                    body = json.loads(event.get('body') or '{}')
                except ValueError:
                    return reply(400,message='Invalid edit.')
                if not isinstance(body,dict):
                    return reply(400,message='Invalid edit.')
                description = body.get('description')
                names = body.get('categories')
                if not isinstance(description,str) or len(description)>500:
                    return reply(400,message='Use a description of up to 500 characters.')
                if not isinstance(names,list) or len(names)>8 or any(
                    not isinstance(n,str) or not 1<=len(n.strip())<=60 or ',' in n or not n.isprintable()
                    for n in names):
                    return reply(400,message='Use up to eight category names of 1�60 characters without commas.')
                names = [n.strip() for n in names]
                if len({n.casefold() for n in names}) != len(names):
                    return reply(400,message='Each category must be unique.')
                if body.get('previous') != [record.get('description',''),record.get('category','Uncategorised')]:
                    return reply(409,message='This video changed. Reopen the editor to load the latest details.')
                try:
                    table.update_item(Key={'videoId':record['videoId']},
                        UpdateExpression='SET #d=:d,#c=:c',
                        ConditionExpression='sourceKey=:key AND (attribute_not_exists(#d) OR #d=:oldD) AND (attribute_not_exists(#c) OR #c=:oldC)',
                        ExpressionAttributeNames={'#d':'description','#c':'category'},
                        ExpressionAttributeValues={':key':key,':d':description.strip(),':c':', '.join(names) or 'Uncategorised',
                                                   ':oldD':record.get('description',''),':oldC':record.get('category','Uncategorised')})
                except ClientError as error:
                    if error.response['Error']['Code']=='ConditionalCheckFailedException':
                        return reply(409,message='Video changed. Reopen the editor and try again.')
                    raise
                return reply(200,message='Changes saved.')
            if record.get('status') not in ('PUBLISHED','FAILED'):
                return reply(409,message='Wait until processing finishes before deleting.')
            s3.delete_object(Bucket=os.environ['SOURCE'],Key=key)
            return reply(202,message='Deletion requested.')
      Events:
        AdminList:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/admin/videos', Method: GET, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        AdminHistory:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/admin/activity', Method: GET, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        AdminUpload:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/admin/videos', Method: POST, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        AdminEdit:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/admin/videos/{id}', Method: PATCH, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        AdminDelete:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/admin/videos/{id}', Method: DELETE, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        List:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: /my-videos, Method: GET, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        Upload:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: /my-videos, Method: POST, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        Edit:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/my-videos/{id}', Method: PATCH, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
        Delete:
          Type: HttpApi
          Properties: {ApiId: !Ref ContributorApi, Path: '/my-videos/{id}', Method: DELETE, Auth: {Authorizer: Contributor, AuthorizationScopes: [openid]}}
Outputs:
  SessionEndpoint:
    Value: !Sub 'https://${ContributorApi}.execute-api.${AWS::Region}.amazonaws.com/me'
  Authority:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}'
  ClientId:
    Value: !Ref Client
  HostedDomain:
    Value: !Sub 'https://${Domain}.auth.${AWS::Region}.amazoncognito.com'
